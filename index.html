<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD8A8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주간 미션">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>우리 주간 미션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* 주간 미션 (친구 가족용) — 기록은 이 기기에만. 포켓몬·티니핑 방은 우리가족 앱의 공통 파일(../our-family/)을 그대로 불러 씀 */
:root {
  --bg: #FFF7EC; --card: #FFFFFF; --ink: #4A2E14; --muted: #9A7A5A; --line: #F3E3CC; --accent: #FF8A3D; --accent2: #FFB46B;
  --font: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.4 var(--font); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 980px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
header { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; }
header h1 { margin: 0; font-size: 24px; font-weight: 400; flex: 1; }
.icon-btn { width: 44px; height: 44px; border: 0; border-radius: 14px; background: var(--card); box-shadow: 0 2px 8px rgba(120,70,20,.08); font-size: 20px; }
.people { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
.people button { display: flex; align-items: center; gap: 6px; flex: none; border: 3px solid transparent; border-radius: 99px; padding: 4px 16px 4px 4px; background: var(--card); font-size: 19px; opacity: .6; }
.people button .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: var(--pc, #FFE2C4); }
.people button[aria-pressed="true"] { opacity: 1; border-color: var(--pc-strong, var(--accent)); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.tabs button { height: 50px; border: 0; border-radius: 16px; background: var(--card); font-size: 18px; color: var(--muted); box-shadow: 0 2px 8px rgba(120,70,20,.06); }
.tabs button[aria-selected="true"] { background: linear-gradient(140deg, #FFE08A, #FFB46B); color: var(--ink); }
.card { background: var(--card); border-radius: 22px; padding: 14px; box-shadow: 0 4px 16px rgba(120,70,20,.08); margin-bottom: 12px; }
/* 미션판 색 (공통 mission-board.js 의 변수) */
.mb { --mb-k1: #FFE08A; --mb-k2: #FFB46B; --mb-kc: #B8650A; --mb-soft: #FFF4E4; --mb-line: #F0D9B8; --mb-muted: #9A7A5A; --mb-font: var(--font); }
.mb-gift-card { --mb-font: var(--font); }
/* 설정 */
.sheet { position: fixed; inset: 0; z-index: 40; background: rgba(60,30,0,.4); display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none; }
.sheet-card { background: var(--bg); width: min(100%, 720px); max-height: 92vh; overflow: auto; border-radius: 24px 24px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
.sheet-card h2 { margin: 0 0 4px; font-weight: 400; font-size: 22px; display: flex; justify-content: space-between; align-items: center; }
.sheet-card .sub { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.pcard { background: var(--card); border-radius: 18px; padding: 12px; margin-bottom: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.row label { color: var(--muted); font-size: 14px; min-width: 64px; }
input[type="text"] { font: inherit; font-size: 17px; border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; background: #fff; color: var(--ink); min-width: 0; flex: 1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 2px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 12px; font-size: 15px; }
.chips button[aria-pressed="true"] { border-color: var(--accent); background: #FFF1E2; }
.chips.av button { font-size: 22px; padding: 2px 8px; }
.sel { font: inherit; font-size: 16px; border: 2px solid var(--line); border-radius: 12px; padding: 6px 8px; background: #fff; color: var(--ink); }
.btn { border: 0; border-radius: 12px; background: var(--accent); color: #fff; padding: 9px 16px; font-size: 16px; }
.btn.ghost { background: #fff; color: var(--ink); border: 2px solid var(--line); }
.btn.danger { background: #fff; color: #C0392B; border: 2px solid #F5C6C0; }
.custom-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.custom-list div { display: flex; gap: 6px; align-items: center; background: #FFF8EE; border-radius: 10px; padding: 4px 8px; font-size: 15px; }
.custom-list div span { flex: 1; }
.custom-list button { border: 0; background: none; color: #C0392B; font-size: 16px; }
.welcome { text-align: center; padding: 30px 10px; }
.welcome .big-e { font-size: 64px; }
.tip { display: flex; gap: 10px; align-items: flex-start; background: #FFF1D6; border: 2px dashed #FFC98A; border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; font-size: 15px; line-height: 1.35; }
.tip > span { font-size: 24px; } .tip b { display: block; font-weight: 400; font-size: 17px; }
.tip button { margin-left: auto; border: 0; background: none; font-size: 18px; color: var(--muted); padding: 0 4px; }
.backup { display: flex; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #4A2E14; color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 15px; z-index: 60; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎯 우리 주간 미션</h1>
    <button class="icon-btn" id="cfg-btn" type="button" aria-label="설정">⚙️</button>
  </header>
  <div id="tip"></div>
  <div class="people" id="people" role="tablist"></div>
  <div class="tabs" id="tabs" role="tablist">
    <button type="button" role="tab" data-tab="ms">🎯 미션</button>
    <button type="button" role="tab" data-tab="room" id="room-tab">🥚 포켓몬</button>
  </div>
  <main id="main"></main>
  <section id="room-box" hidden></section>
</div>
<div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheet-card"></div></div>

<script src="../our-family/stickers-shared.js"></script>
<script src="../our-family/poke-room.js"></script>
<script src="../our-family/mission-board.js"></script>
<script>
(() => {
  'use strict';
  /* ── 기록: 이 기기에만 (localStorage). 사람 = { k, name, set: 'poke' | 'ping', av }, kids.{k} = 우리가족 앱의 아이 자료와 같은 모양 ── */
  const FS = window.FamilyStickers;
  const KEY = 'weekly-mission:v1';
  const $ = (s) => document.querySelector(s);
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } };
  let S = load() || { people: [], kids: {}, cur: '', tab: 'ms' };
  S.people = Array.isArray(S.people) ? S.people : []; S.kids = S.kids || {};
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
  const lang = 'ko';
  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k === 'html') e.innerHTML = v; else if (k === 'style') e.style.cssText = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
    }
    for (const c of kids) if (c != null && c !== false) e.append(c);
    return e;
  }
  const keyOf = (x) => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
  const today = () => keyOf(new Date());
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const SND = (FS && FS.SND) || { tap() {}, tada() {}, boing() {}, stick() {}, coin() {} };
  function toast(t) { const e = h('div', { class: 'toast', text: t }); document.body.append(e); setTimeout(() => e.remove(), 2200); }


  /* ── 공통 파일은 아이 이름(다빈 = 포켓몬, 아린 = 티니핑)으로 그림을 고름 → 여기서는 사람마다 고른 세트로 바꿔 줌 ── */
  const person = (k) => S.people.find((p) => p.k === k);
  const setOf = (k) => ((person(k) || {}).set === 'ping' ? 'ping' : 'poke');
  const alias = (k) => (k === 'arin' || k === 'davin' ? k : setOf(k) === 'ping' ? 'arin' : 'davin');
  if (FS) for (const f of ['stickerSVG', 'giftSVG', 'bigSVG', 'charSet']) { const orig = FS[f]; if (typeof orig === 'function') FS[f] = (k, ...a) => orig(alias(k), ...a); }

  const kid = (k) => (S.kids[k] = S.kids[k] || {});
  function write(k, path, v) {
    let o = kid(k);
    for (const p of path.slice(0, -1)) o = o[p] = (o[p] && typeof o[p] === 'object') ? o[p] : {};
    const last = path[path.length - 1];
    if (v == null) delete o[last]; else o[last] = v;
    save();
  }
  // 오래된 기록 정리: 미션 체크 6주, 스티커는 지금 판이 아니면서 3달 지난 것
  (function prune() {
    const cut = keyOf(new Date(Date.now() - 42 * 864e5)), old = Date.now() - 90 * 864e5;
    for (const kd of Object.values(S.kids)) {
      for (const d of Object.keys(kd.mdone || {})) if (d < cut) delete kd.mdone[d];
      const start = (kd.cfg && kd.cfg.start) || 0;
      for (const [id, st] of Object.entries(kd.stickers || {})) if (!st || ((st.at || 0) < old && (st.at || 0) < start)) delete kd.stickers[id];
    }
    save();
  })();

  /* ── 사람 · 탭 ── */
  const AV = ['🐻', '🐰', '🦊', '🐱', '🐶', '🐼', '🦄', '🐥', '🐯', '🐸'];
  const PC = ['#FFE08A', '#FFC2E2', '#C6E2FF', '#C8F0D8'];
  let roomCtl = null;
  function render() {
    if (!FS) { $('#main').replaceChildren(h('div', { class: 'card welcome' }, h('div', { class: 'big-e', text: '📶' }), h('p', { text: '처음 한 번은 인터넷이 필요해요. 연결한 뒤 다시 열어 주세요.' }))); return; }
    if (!S.people.length) { $('#people').replaceChildren(); $('#tabs').hidden = true; $('#room-box').hidden = true; roomOff(); boardOff();
      $('#main').replaceChildren(h('div', { class: 'card welcome' }, h('div', { class: 'big-e', text: '🎯' }), h('p', { text: '아이 이름을 넣고 미션을 골라 주세요.' }), h('button', { class: 'btn', type: 'button', text: '시작하기', onclick: openCfg })));
      return; }
    if (!person(S.cur)) S.cur = S.people[0].k;
    const k = S.cur;
    $('#people').replaceChildren(...S.people.map((p, i) => h('button', { type: 'button', role: 'tab', 'aria-pressed': String(p.k === k), style: `--pc:${PC[i % 4]}`,
      onclick: () => { if (S.cur === p.k) return; S.cur = p.k; save(); roomOff(); SND.tap(1); render(); } }, h('span', { class: 'av', text: p.av || '🐻' }), p.name || '?')));
    $('#tabs').hidden = false;
    $('#room-tab').textContent = setOf(k) === 'ping' ? '💖 티니핑' : '🥚 포켓몬';
    for (const b of document.querySelectorAll('[data-tab]')) b.setAttribute('aria-selected', String(b.dataset.tab === S.tab));
    if (S.tab === 'room' && window.PokeRoom) {
      boardOff(); $('#main').replaceChildren(); $('#room-box').hidden = false;
      if (!roomCtl || roomCtl.k !== k) { roomOff(); roomCtl = window.PokeRoom.mount($('#room-box'), { kid: k, lang: () => lang, data: () => kid(k), write: (path, v) => { write(k, path, v); queueRoom(); }, snd: SND, big: window.innerWidth >= 760 }); roomCtl.k = k; }
      else roomCtl.update();
    } else { roomOff(); $('#room-box').hidden = true; renderMissions(k); }
  }
  let roomT = 0;
  const queueRoom = () => { clearTimeout(roomT); roomT = setTimeout(() => { if (roomCtl) roomCtl.update(); }, 0); };
  function roomOff() { if (roomCtl) { roomCtl.destroy(); roomCtl = null; } }
  for (const b of document.querySelectorAll('[data-tab]')) b.addEventListener('click', () => { S.tab = b.dataset.tab; save(); SND.tap(2); render(); });

  /* ── 🎯 미션 · 선물 상자 · 주간 미션판 · 황금 스티커: 우리가족 앱과 같은 공통 파일(../our-family/mission-board.js) ── */
  let boardCtl = null;
  function boardOff() { if (boardCtl) { boardCtl.destroy(); boardCtl = null; } }
  function renderMissions(k) {
    const box = $('#main');
    if (!window.MissionBoard) { box.replaceChildren(h('div', { class: 'card welcome' }, h('p', { text: '처음 한 번은 인터넷이 필요해요.' }))); return; }
    if (boardCtl && boardCtl.k === k && box.contains(boardCtl.el)) { boardCtl.update(); return; }
    boardOff();
    const card = h('div', { class: 'card' });
    box.replaceChildren(card);
    boardCtl = window.MissionBoard.mount(card, { kid: k, lang: () => lang, data: () => kid(k), write: (path, v) => write(k, path, v), snd: SND, big: window.innerWidth >= 760,
      text: { noReward: '선물 미정 (⚙️에서 정해요)', noMs: '⚙️ 설정에서 미션을 골라 주세요' } });
    boardCtl.el = card;
  }

  /* ── ⚙️ 설정: 사람(이름 · 그림 · 포켓몬/티니핑) · 미션 · 선물 ── */
  const PRESET = ['brushAM', 'brushPM', 'bag', 'study', 'read', 'dress', 'toys', 'clothes', 'bed', 'table', 'shoes', 'music', 'sport', 'deutsch'];
  const DEFAULT_MS = ['brushAM', 'toys', 'clothes', 'read'];
  let draft = null, newText = {};
  function openCfg() {
    draft = { people: S.people.map((p) => ({ ...p, missions: [...FS.missionsOf(kid(p.k), p.k)].map((x) => ({ ...x })), reward: (kid(p.k).cfg || {}).reward || '', big: FS.cfgOf(kid(p.k), p.k).big })) };
    if (!draft.people.length) addPerson();
    renderCfg(); $('#sheet').hidden = false; document.body.style.overflow = 'hidden';
  }
  function closeCfg() { $('#sheet').hidden = true; document.body.style.overflow = ''; draft = null; }
  function addPerson() {
    const used = new Set(draft.people.map((p) => p.k));
    let n = 1; while (used.has('p' + n)) n++;
    draft.people.push({ k: 'p' + n, name: '', set: 'poke', av: AV[(n - 1) % AV.length], missions: DEFAULT_MS.map((id) => ({ id })), reward: '', big: 4 });
  }
  function renderCfg() {
    const card = $('#sheet-card');
    const cards = draft.people.map((p, i) => {
      const has = (id) => p.missions.some((x) => x.id === id);
      const custom = p.missions.filter((x) => !FS.MISSIONS[x.id]);
      const name = h('input', { type: 'text', value: p.name, placeholder: '이름', maxlength: '10', oninput: (e) => { p.name = e.target.value; } });
      const rw = h('input', { type: 'text', value: p.reward, placeholder: '예: 아이스크림, 놀이공원', maxlength: '30', oninput: (e) => { p.reward = e.target.value; } });
      const ct = h('input', { type: 'text', value: newText[p.k] || '', placeholder: '직접 쓰기 (예: 줄넘기)', maxlength: '20', oninput: (e) => { newText[p.k] = e.target.value; } });
      return h('div', { class: 'pcard' },
        h('div', { class: 'row' }, h('label', { text: `${i + 1}. 이름` }), name),
        h('div', { class: 'row' }, h('label', { text: '그림' }), h('div', { class: 'chips av' }, ...AV.map((a) => h('button', { type: 'button', 'aria-pressed': String(p.av === a), text: a, onclick: () => { p.av = a; renderCfg(); } })))),
        h('div', { class: 'row' }, h('label', { text: '키우기' }), h('div', { class: 'chips' },
          h('button', { type: 'button', 'aria-pressed': String(p.set !== 'ping'), text: '🥚 포켓몬', onclick: () => { p.set = 'poke'; renderCfg(); } }),
          h('button', { type: 'button', 'aria-pressed': String(p.set === 'ping'), text: '💖 티니핑', onclick: () => { p.set = 'ping'; renderCfg(); } }))),
        h('div', { class: 'row' }, h('label', { text: '미션' }), h('div', { class: 'chips' }, ...PRESET.filter((id) => FS.MISSIONS[id]).map((id) => h('button', { type: 'button', 'aria-pressed': String(has(id)),
          text: `${FS.MISSIONS[id][0]} ${FS.MISSIONS[id][1]}`, onclick: () => { p.missions = has(id) ? p.missions.filter((x) => x.id !== id) : [...p.missions, { id, ...(id === 'bag' ? { wd: true } : {}) }]; renderCfg(); } })))),
        h('div', { class: 'row' }, h('label'), ct, h('button', { type: 'button', class: 'btn ghost', text: '+ 추가', onclick: () => {
          const t = (newText[p.k] || '').trim(); if (!t) return;
          p.missions.push({ id: 'c' + newId(), text: t, ic: '⭐' }); newText[p.k] = ''; renderCfg();
        } })),
        custom.length ? h('div', { class: 'custom-list' }, ...custom.map((x) => h('div', {}, h('span', { text: `⭐ ${x.text}` }), h('button', { type: 'button', text: '✕', onclick: () => { p.missions = p.missions.filter((y) => y !== x); renderCfg(); } })))) : null,
        h('div', { class: 'row', style: 'margin-top:10px' }, h('label', { text: '선물' }), rw),
        h('div', { class: 'row' }, h('label', { text: '황금 스티커' }), h('select', { class: 'sel', onchange: (e) => { p.big = Number(e.target.value); } },
          ...[2, 3, 4, 5, 6, 8].map((n) => { const o = h('option', { value: String(n), text: `${n}개 모으면 선물` }); if (n === p.big) o.selected = true; return o; }))),
        draft.people.length > 1 ? h('button', { type: 'button', class: 'btn danger', text: '이 사람 빼기', onclick: () => {
          if (S.kids[p.k] && !confirm(`${p.name || '이 사람'}의 기록이 모두 지워져요. 뺄까요?`)) return;
          draft.people = draft.people.filter((x) => x !== p); renderCfg();
        } }) : null);
    });
    card.replaceChildren(
      h('h2', {}, h('span', { text: '⚙️ 설정' }), h('button', { type: 'button', class: 'icon-btn', text: '✕', onclick: closeCfg })),
      h('p', { class: 'sub', text: '기록은 이 기기에만 저장돼요. 미션은 매일, 「가방 챙기기」는 평일만.' }),
      ...cards,
      draft.people.length < 4 ? h('button', { type: 'button', class: 'btn ghost', style: 'width:100%;margin-bottom:12px', text: '+ 사람 추가 (최대 4명)', onclick: () => { addPerson(); renderCfg(); } }) : null,
      S.people.length ? h('div', { class: 'pcard' }, h('div', { class: 'row', style: 'margin-bottom:4px' }, h('b', { text: '💾 기록 백업' })),
        h('p', { class: 'sub', text: '휴대폰을 바꾸거나 기록이 지워져도 다시 불러올 수 있어요. 가끔 저장해 두세요.' }),
        h('div', { class: 'backup' }, h('button', { type: 'button', class: 'btn ghost', text: '💾 백업 파일 저장', onclick: exportData }), h('button', { type: 'button', class: 'btn ghost', text: '📂 백업 불러오기', onclick: importData }))) : null,
      h('button', { type: 'button', class: 'btn', style: 'width:100%;padding:13px;font-size:18px', text: '저장', onclick: saveCfg }));
  }
  function saveCfg() {
    if (draft.people.some((p) => !p.name.trim())) { alert('이름을 넣어 주세요'); return; }
    const keep = new Set(draft.people.map((p) => p.k));
    for (const k of Object.keys(S.kids)) if (!keep.has(k)) delete S.kids[k];
    S.people = draft.people.map((p) => ({ k: p.k, name: p.name.trim(), set: p.set, av: p.av }));
    for (const p of draft.people) {
      const kd = kid(p.k);
      kd.missions = p.missions;
      kd.cfg = { ...(kd.cfg || {}), reward: p.reward.trim(), big: p.big };
    }
    if (!person(S.cur)) S.cur = S.people[0].k;
    save(); closeCfg(); roomOff(); boardOff(); render(); toast('저장했어요');
  }
  /* ── 💾 백업: 기록은 이 기기에만 있어서 파일로 저장 · 불러오기 ── */
  async function exportData() {
    const txt = JSON.stringify({ app: 'weekly-mission', v: 1, at: Date.now(), data: { people: S.people, kids: S.kids } });
    const name = `주간미션-백업-${today()}.json`;
    try {
      const file = new File([txt], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); toast('백업 파일을 저장했어요'); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = h('a', { href: URL.createObjectURL(new Blob([txt], { type: 'application/json' })), download: name });
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('백업 파일을 저장했어요');
  }
  function importData() {
    const inp = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
    inp.addEventListener('change', async () => {
      const f = inp.files && inp.files[0];
      inp.remove();
      if (!f) return;
      try {
        const j = JSON.parse(await f.text()), d = j && j.app === 'weekly-mission' ? j.data : null;
        if (!d || !Array.isArray(d.people) || !d.kids || typeof d.kids !== 'object') throw new Error('bad');
        if (!confirm(`백업 파일 (${d.people.map((p) => p.name).join(', ')}) 로 지금 기록을 바꿀까요?`)) return;
        S.people = d.people.slice(0, 4); S.kids = d.kids; S.cur = (S.people[0] || {}).k || '';
        save(); closeCfg(); roomOff(); boardOff(); render(); toast('백업을 불러왔어요');
      } catch { alert('백업 파일을 읽을 수 없어요'); }
    });
    document.body.append(inp); inp.click();
  }
  /* ── 📲 홈 화면에 추가 안내: 아이폰 Safari 는 홈 화면 앱이 아니면 한동안 안 열 때 기록을 지울 수 있음 ── */
  const standalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  function showTip() {
    let off = false;
    try { off = localStorage.getItem('weekly-mission:tip') === 'off'; } catch {}
    if (standalone() || off) { $('#tip').replaceChildren(); return; }
    const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    $('#tip').replaceChildren(h('div', { class: 'tip' }, h('span', { text: '📲' }),
      h('div', {}, h('b', { text: '홈 화면에 추가해 주세요' }), ios ? 'Safari 아래 [공유] → [홈 화면에 추가]. 그래야 기록이 안전하게 남아요.' : '브라우저 메뉴(⋮) → [홈 화면에 추가]. 그래야 기록이 안전하게 남아요.'),
      h('button', { type: 'button', 'aria-label': '닫기', text: '✕', onclick: () => { try { localStorage.setItem('weekly-mission:tip', 'off'); } catch {} showTip(); } })));
  }
  showTip();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {} // 기록을 함부로 지우지 말아 달라고 브라우저에 부탁

  $('#cfg-btn').addEventListener('click', openCfg);
  $('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') closeCfg(); });

  // 날짜가 바뀌거나 다시 열면 새로 그림
  let lastDay = today();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); render(); } });
  setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60e3);
  render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
